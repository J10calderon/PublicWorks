<script>
    let token = localStorage.getItem('token')

    let isLoading = false
    let isAuthenticating = false
    let isRegistration = false
    // let selectedTab = 'All'

    const apiBase = '/'

    // elements

    const firstname = document.getElementById('firstname');
    const lastname = document.getElementById('lastname');

    async function toggleIsRegister() {
    isRegistration = !isRegistration
    registerBtn.innerText = isRegistration ? 'Login' : 'Register'
    document.querySelector('#auth > div h2').innerText = isRegistration ? 'Register' : 'Login'
    document.querySelector('.register-content p').innerText = isRegistration ? 'Already have an account?' : 'Don\'t have an account?'


    document.querySelector('#firstname').style.visibility = isRegistration ? 'visible' : 'hidden'
    document.querySelector('#lastname').style.visibility = isRegistration ? 'visible' : 'hidden'
    document.querySelector('#email').style.visibility = isRegistration ? 'visible' : 'hidden'
    }

    // PAGE RENDERING LOGIC
    async function showDashboard() {
        // nav.style.display = 'block'

    function renderIncidents() {
        // need to add filtering logic in here

        // updateNavCount()
        // updateHeaderText()

        console.log('rendering incidents')

        let incidentList = `<div class="card-container">`

        // incidents.forEach((todo, todoIndex) => {
        incidents.forEach((incident, incidentIndex) => {
            incidentIndex = incident.id
            incidentList += `
            <div class="card incident-item">
                <div class="incident-col-1">
                    <dl>
                        <dt>Description:</dt>
                        <dt>Reported by:</dt>
                        <dt>Country:</dt>
                        <dt>Region:</dt>
                        <dt>City:</dt>
                        <dt>Street:</dt>
                        <dt>Latitude:</dt>
                        <dt>Longitude:</dt>
                        <dt>Date:</dt>
                        <dt>ID:</dt>
                    </dl>
                        
                    <dl>
                        <dd id="incident-description${incidentIndex}" contenteditable="true">${incident.description}</dd>
                        <dd id="incident-reported-by${incidentIndex}" contenteditable="false">${incident.reported_by}</dd>
                        <dd id="incident-country${incidentIndex}" contenteditable="true">${incident.country}</dd>
                        <dd id="incident-region${incidentIndex}" contenteditable="true">${incident.region}</dd>
                        <dd id="incident-city${incidentIndex}" contenteditable="true">${incident.city}</dd>
                        <dd id="incident-street${incidentIndex}" contenteditable="true">${incident.street}</dd>
                        <dd id="incident-latitude${incidentIndex}" contenteditable="true">${incident.latitude}</dd>
                        <dd id="incident-longitude${incidentIndex}" contenteditable="true">${incident.longitude}</dd>
                        <dd id="incident-date${incidentIndex}" contenteditable="true">${incident.date}</dd>
                        <dd id="incident-id${incidentIndex}" contenteditable="true">${incident.id}</dd>
                    </dl>
                </div>
                <div class="incident-col-2">
                    <img class="incident-image" src="images/map-cutout.png">
                </div>
                <div class="incident-buttons">
                        <button onclick="updateIncident(${incidentIndex})">
                            <h4>Update</h4>
                        </button>
                        <button onclick="deleteIncident(${incidentIndex})">
                            <h4>Delete</h4>
                        </button>
                </div>
            </div>
            `
        })

        incidentList += `</div>`
        main.innerHTML = incidentList
    }


    async function authenticate() {
    // access username and pass values
    // const usernameVal = username.value
    // const passVal = password.value
    // const firstnameVal = firstname.value
    // const lastnameVal = lastname.value
    // const emailVal = email.value


    //TEMPORARY for development-include values so that dev doesnt need to put it in every update
    const usernameVal = "jiocalderon"
    const passVal = "jiocalderon"
    const firstnameVal = "jio"
    const lastnameVal = "calderon"
    const emailVal = "jcalderon@gmail.com"


    console.log('hello world')
    // guard clauses... if authenticating, return
    if (
        isLoading ||
        isAuthenticating ||
        !usernameVal ||
        !passVal ||
        passVal.length < 6
    ) { return }

    // reset error and set isAuthenticating to true
    // error.style.display = 'none'
    isAuthenticating = true
    authBtn.innerText = 'Authenticating...'

    try {
        let data
        if (isRegistration) {
            // register an account

            console.log('attempting to register') 
            const response = await fetch(apiBase + 'auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameVal, password: passVal, firstname: firstnameVal, lastname:lastnameVal, email: emailVal})

            })
            data = await response.json()
        } else {
            // login an account
            const response = await fetch(apiBase + 'auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameVal, password: passVal })
            })
            data = await response.json()
        }

        if (data.token) {
            token = data.token
            localStorage.setItem('token', token)

            // authenicating into loading
            authBtn.innerText = 'Loading...'

            // fetch incidents
            await fetchIncidents()

            // show dashboard
            showDashboard()
            
        } else {
            throw Error('❌ Failed to authenticate...')
        }

    } catch (err) {
        console.log(err.message)
        // error.innerText = err.message
        // error.style.display = 'block'
    } finally {
        authBtn.innerText = 'Submit'
        isAuthenticating = false
    }
}

    //CRUD LOGIC

    async function fetchIncidents() {

        console.log('fetching incidents')
        isLoading = true
        const response = await fetch(apiBase + 'incident', {
            headers: {
                'Content-Type': 'application/json',
                'Authorization': token
            },
        })
        const incidentData = await response.json()
        console.log(incidentData)
        incidents = incidentData
        isLoading = false
        renderIncidents()
    }
 
    async function updateIncident(index) {
        // set task complete status to true

        let incident = incidents.find(inc => inc.id === index)
        console.log(incident)

        await fetch(apiBase + 'incident' + '/' + index, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': token
            },
            body: JSON.stringify({    
                country: document.getElementById(`incident-country${index}`).textContent,
                region: document.getElementById(`incident-region${index}`).textContent,
                city: document.getElementById(`incident-city${index}`).textContent,
                street: document.getElementById(`incident-street${index}`).textContent,
                latitude: document.getElementById(`incident-latitude${index}`).textContent,
                longitude: document.getElementById(`incident-longitude${index}`).textContent,
                date: document.getElementById(`incident-date${index}`).textContent,
                description: document.getElementById(`incident-description${index}`).textContent})
        })
        fetchIncidents()
    }

    async function deleteIncident(index) {
        await fetch(apiBase + 'incident' + '/' + index, {
            method: 'DELETE',
            headers: {
                'Authorization': token
            },
        })
        fetchIncidents()
    }
